<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的小站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 密码门 -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-heart">💗</div>
    <h1>我们的小站</h1>
    <p>只有我们能进来</p>
    <input id="gate-input" type="password" inputmode="numeric" placeholder="密码" autocomplete="off">
    <button id="gate-btn">进入</button>
    <div id="gate-err"></div>
  </div>
</div>

<!-- 主内容 -->
<div id="app" class="hidden">
  <nav>
    <button class="tab active" data-tab="wheel">🎡 今天吃啥</button>
    <button class="tab" data-tab="gallery">📷 我们的回忆</button>
  </nav>

  <!-- 轮盘 -->
  <section id="tab-wheel">
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <canvas id="wheel" width="600" height="600"></canvas>
      <button id="spin-btn">转！</button>
    </div>
    <div id="result" class="hidden"></div>
  </section>

  <!-- 相册 -->
  <section id="tab-gallery" class="hidden">
    <div id="photo-grid"></div>
  </section>
</div>

<!-- 大图查看 -->
<div id="lightbox" class="hidden">
  <span id="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-caption"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
